name: Release Build

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'jetbrains'
      - name: Build universal jar
        run: ./gradlew fatJarUniversal
      - name: Collect artifacts
        run: |
          mkdir Output
          cp app/build/libs/GitIA-universal-*.jar Output/GitIA-universal.jar
          cd Output
          find . -type f -exec bash -c "sha256sum {} > {}.sum" \;
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Output/*
